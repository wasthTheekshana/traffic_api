services:
  collector:
    build: .
    image: traffic-collector:latest
    container_name: api_sample_collector
    restart: unless-stopped
    env_file: .env
    volumes:
      - /mnt/disks/data/traffic:/app/data
      - ./config.json:/app/config.json:ro
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tomtom-collector:
    image: traffic-collector:latest      # same image, built by the service above
    container_name: tomtom_collector
    command: ["python", "tomtom_collector.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      - INTERVAL_SECONDS=1800
      - ACTIVE_HOURS=0-23
      - DAILY_LIMIT=640
      - MONTHLY_LIMIT=19000
      - DATA_DIR=/app/data/tomtom
      - POINTS_FILE=/app/tomtom_points.json
    volumes:
      - /mnt/disks/data/traffic:/app/data
      - ./tomtom_points.json:/app/tomtom_points.json:ro
    depends_on:
      - collector
    healthcheck:
      # own heartbeat file; healthy if a cycle finished within the last hour
      test: ["CMD", "python", "-c", "import time,sys;t=int(open('/app/data/tomtom/.heartbeat').read());sys.exit(0 if time.time()-t<3600 else 1)"]
      interval: 5m
      timeout: 10s
      start_period: 3m
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"